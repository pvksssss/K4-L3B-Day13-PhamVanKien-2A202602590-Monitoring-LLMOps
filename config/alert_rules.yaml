alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000 ms over a rolling 5-minute window'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: llmops-on-call
    runbook: docs/alerts.md#alert-1
  - name: RequestOrRetrievalFailures
    severity: critical
    condition: 'request_failed / request_received > 2% OR retrieval success < 90% over a rolling 5-minute window with at least 20 requests'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: llmops-on-call
    runbook: docs/alerts.md#alert-2
  - name: QualityOrCostGuardrail
    severity: warning
    condition: 'mean(response_sent.quality_score) < 0.75 over a rolling 10-minute window OR rolling 24-hour sum(response_sent.cost_usd) > 2.50 USD'
    duration: 10m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: llmops-on-call
    runbook: docs/alerts.md#alert-3
